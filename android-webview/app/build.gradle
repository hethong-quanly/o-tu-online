plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("../android-keys/keystore-credentials.txt")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'vn.otuonline.app'
    compileSdk 34

    defaultConfig {
        applicationId "vn.otuonline.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    signingConfigs {
        release {
            if (keystoreProperties['UPLOAD_STORE_FILE']) {
                storeFile rootProject.file("../android-keys/" + keystoreProperties['UPLOAD_STORE_FILE'])
                storePassword keystoreProperties['UPLOAD_STORE_PASSWORD']
                keyAlias keystoreProperties['UPLOAD_KEY_ALIAS']
                keyPassword keystoreProperties['UPLOAD_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    bundle {
        language { enableSplit = false }
        density { enableSplit = false }
        abi { enableSplit = true }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
