<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0907" />
  <title>Ở tù online</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ở tù online" />
  <meta name="application-name" content="Ở tù online" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Full-screen prison yard -->
  <canvas id="yard" tabindex="0" role="img" aria-label="Sân trại giam — bản đồ nhiều phòng"></canvas>
  <div id="nametags" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Join / character intro (similar layout pattern to reference: centered panel) -->
  <section id="join-screen" class="overlay-panel" aria-labelledby="join-h">
    <div class="panel-card join-card">
      <div class="lotus-ish" aria-hidden="true">⛓️</div>
      <h1 id="join-h">Ở tù online</h1>
      <p class="sub">Mô phỏng đời sống trong tù · Nhiều người chơi</p>
      <label class="lbl" for="nick">Biệt danh tù nhân</label>
      <div class="ten">
        <input id="nick" maxlength="16" autocomplete="nickname" placeholder="VD: Tí Sắt" />
        <span class="dem" id="nick-dem">0/16</span>
      </div>
      <p class="ghi">Người khác chỉ thấy biệt danh và hình tù nhân áo sọc. Quản trại (NPC) tuần tra sân.</p>
      <button id="btn-join" class="btn pri big" type="button">Vào trại</button>
      <p id="join-error" class="error" role="alert"></p>
    </div>
  </section>

  <!-- Top bar -->
  <header class="topbar" id="topbar" hidden>
    <div class="pill" id="pill-online" title="Đang online">
      <span class="dot"></span>
      <span class="txt" id="online-count">0 online</span>
    </div>
    <div class="ttl">
      <h1>Ở tù online</h1>
      <div class="sub" id="room-label">Phòng A</div>
    </div>
    <div class="tools">
      <button class="ibtn" id="btn-panel-stats" type="button" title="Trạng thái" aria-label="Trạng thái">❤️</button>
      <button class="ibtn" id="btn-panel-chat" type="button" title="Chat" aria-label="Chat">💬</button>
      <div class="pill nick-pill"><span class="txt" id="my-nick">—</span></div>
    </div>
  </header>

  <!-- Left status chip -->
  <div class="hud-left" id="hud-left" hidden>
    <div class="goc">
      <span class="cham"></span>
      <div class="goc-chu">
        <div class="goc-chinh" id="stat-money-line">💰 50</div>
        <div class="goc-phu" id="stat-bars-line">❤️ 100 · ⚡ 100 · ⭐ 0</div>
      </div>
    </div>
  </div>

  <!-- Bottom action bar -->
  <nav class="botbar" id="botbar" hidden aria-label="Hành động">
    <button class="btn le" type="button" data-open="jobs"><span class="ico">🛠️</span><span class="le-ten">Làm việc</span></button>
    <button class="btn le" type="button" data-open="shop"><span class="ico">🛒</span><span class="le-ten">Cửa hàng</span></button>
    <button class="btn pri big" id="btn-escape" type="button">🏃 Vượt ngục</button>
    <button class="btn le" type="button" data-open="board"><span class="ico">🏆</span><span class="le-ten">BXH</span></button>
    <button class="btn le" type="button" data-open="help"><span class="ico">ℹ️</span><span class="le-ten">Gợi ý</span></button>
  </nav>

  <!-- Side panel -->
  <aside class="sidebang" id="sidebang" hidden>
    <button class="ibtn x" id="side-x" type="button" aria-label="Đóng">×</button>
    <h2 class="bang-tt" id="side-title">—</h2>
    <p class="bang-phu" id="side-phu"></p>
    <div id="side-body"></div>
  </aside>

  <div class="toast" id="toast" role="status"></div>
  <p class="hint-move" id="hint-move" hidden>Chạm / click phòng trên bản đồ để di chuyển · −3⚡</p>

  <div id="escape-overlay" class="overlay-panel" hidden>
    <div class="panel-card">
      <h2 id="escape-title">—</h2>
      <p id="escape-detail"></p>
      <button id="btn-replay" class="btn pri big" type="button">Chơi lại (đời mới)</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/sprites.js"></script>
  <script src="/client.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
